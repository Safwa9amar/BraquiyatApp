; ==============================================================================
; ملف إعدادات نظام تسيير البرقيات — BraquiyatApp.ini
; Configuration file for BraquiyatApp
; ==============================================================================

[Database]
; مسار ملف قاعدة البيانات (اتركه فارغاً ليتم العثور على Braquiyat.accdb تلقائياً بجانب البرنامج)
; Path to database file. Leave empty to auto-detect beside the executable.
Path=

; مشغل قاعدة البيانات: Microsoft.ACE.OLEDB.12.0 أو Microsoft.ACE.OLEDB.16.0
; اتركه فارغاً ليقوم البرنامج بتجربة المشغل المتوفر على الجهاز تلقائياً
; OLEDB Provider. Leave empty for automatic detection and fallback.
Provider=

[UI]
; نمط واجهة البرنامج
; Theme / VCL Style name
Style=Windows11 Modern Light
